[package]
name = "orbis-sessiond"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Orbis Control: read-only user session daemon and typed D-Bus API"

[[bin]]
name = "orbis-sessiond"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
orbis-core = { workspace = true }
orbis-config = { workspace = true }
orbis-capabilities = { workspace = true }
orbis-providers = { workspace = true }
orbis-session-protocol = { path = "../orbis-session-protocol", version = "0.1.0" }

[features]
# Mock is opt-in for dedicated tests/development only. Production bootstrap
# always composes real UPower/kernel/supergfxd/asusd providers.
mock = ["orbis-providers/mock"]
default = []

[dev-dependencies]
tempfile = { workspace = true }
zbus = { workspace = true, features = ["p2p"] }
orbis-test-support = { workspace = true }
orbis-providers = { path = "../orbis-providers", version = "0.1.0", default-features = false, features = ["mock"] }
