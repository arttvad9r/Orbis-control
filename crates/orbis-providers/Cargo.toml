[package]
name = "orbis-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Orbis Control: typed production provider interfaces and implementations"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true, features = ["p2p"] }
# Mature typed Wayland client binding (уже в дереве зависимостей через
# slint/winit). Используется только для read-only чтения wl_output; никакого
# compositor toolkit и никаких writes.
wayland-client = "0.31"
orbis-core = { workspace = true }
orbis-capabilities = { workspace = true }

[features]
# Mock остаётся отдельным test/development capability. Default feature
# сохраняется временно для совместимости существующего test/snapshot graph;
# production composition не использует MockProvider.
default = ["mock"]
mock = []
