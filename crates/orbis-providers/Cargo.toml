[package]
name = "orbis-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Orbis Control: typed production provider interfaces and implementations"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "process", "time"] }
tracing = { workspace = true }
zbus = { workspace = true, features = ["p2p"] }
# Mature typed Wayland client binding (уже в дереве зависимостей через
# slint/winit). Используется только для read-only чтения wl_output; никакого
# compositor toolkit и никаких writes.
wayland-client = "0.31"
# ext-idle-notify-v1 (staging): input idleness for the keyboard backlight timeout.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
rustix = { workspace = true, features = ["event"] }
orbis-core = { workspace = true }
orbis-capabilities = { workspace = true }
# Read-only queries and typed writes of NVIDIA clock offsets and power limit;
# libnvidia-ml is loaded at run time, so machines without NVIDIA are unaffected.
nvml-wrapper = "0.13"

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Mock остаётся отдельным test/development capability. Default feature
# сохраняется временно для совместимости существующего test/snapshot graph;
# production composition не использует MockProvider.
default = ["mock"]
mock = []
