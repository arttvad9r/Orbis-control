[package]
name = "orbis-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Orbis Control: typed production provider interfaces and implementations"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zbus = { workspace = true, features = ["p2p"] }
# Typed Wayland/KMS evidence stack. Exact compatible versions are already
# present in Cargo.lock through Slint/Smithay; making them direct dependencies
# does not introduce a new protocol implementation or generic mutation surface.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
drm = "0.14"
orbis-core = { workspace = true }
orbis-capabilities = { workspace = true }

[features]
# Mock остаётся отдельным test/development capability. Default feature
# сохраняется временно для совместимости существующего test/snapshot graph;
# production composition не использует MockProvider.
default = ["mock"]
mock = []
