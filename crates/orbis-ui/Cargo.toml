[package]
name = "orbis-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Orbis Control: GUI на Slint (только представление)"

[[bin]]
name = "orbis-control"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
slint = { workspace = true }
orbis-core = { workspace = true }
orbis-capabilities = { workspace = true }
orbis-application = { path = "../orbis-application", version = "0.1.0" }
# Прямая зависимость на provider traits для worker; default-features=false,
# чтобы не добавлять новых причин включения mock в production (mock уже идёт
# транзитивно через orbis-sessiond на текущем этапе).
orbis-providers = {
    path = "../orbis-providers",
    version = "0.1.0",
    default-features = false,
    features = ["mock"],
}
orbis-sessiond = { workspace = true }
orbis-test-support = { workspace = true }
image = { workspace = true }

[build-dependencies]
slint-build = "1"

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }

[features]
mock = ["orbis-sessiond/mock"]
default = ["mock"]
