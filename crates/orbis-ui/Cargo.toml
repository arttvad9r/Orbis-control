[package]
name = "orbis-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Orbis Control: Slint GUI, UI runtime and production composition"

[[bin]]
name = "orbis-control"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
zbus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
slint = { workspace = true }
orbis-core = { workspace = true }
orbis-config = { workspace = true }
orbis-capabilities = { workspace = true }
orbis-application = { path = "../orbis-application", version = "0.1.0" }
orbis-session-client = { path = "../orbis-session-client", version = "0.1.0" }
orbis-providers = { path = "../orbis-providers", version = "0.1.0", default-features = false }
orbis-sessiond = { workspace = true }
# Still a production dependency only because UiState::from_mock_profile is used
# by the current shared production/offscreen bootstrap. Removing this dependency
# is the remaining #115 UI-state refactor.
orbis-test-support = { workspace = true }
image = { workspace = true }

[build-dependencies]
slint-build = "1"

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }
orbis-providers = { path = "../orbis-providers", version = "0.1.0", default-features = false, features = ["mock"] }

[features]
# Explicit compatibility feature for dedicated mock/dev builds. Production
# default no longer turns on sessiond/mock.
mock = ["orbis-providers/mock", "orbis-sessiond/mock"]
default = []
