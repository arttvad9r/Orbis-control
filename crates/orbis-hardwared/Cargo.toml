[package]
name = "orbis-hardwared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Orbis Control: привилегированный hardware helper (foundation)"

[[bin]]
name = "orbis-hardwared"
path = "src/main.rs"

[[bin]]
name = "fan-live-validate"
path = "src/bin/fan-live-validate.rs"
required-features = ["live-validation"]

[features]
live-validation = []

[dependencies]
serde = { workspace = true }
orbis-core = { workspace = true }
orbis-providers = { workspace = true }
zbus = { workspace = true }
zbus_polkit = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
zbus = { workspace = true, features = ["p2p"] }
