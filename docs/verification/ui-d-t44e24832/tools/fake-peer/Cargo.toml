[package]
name = "orbis-fake-session-peer"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

# Standalone evidence tool: not a workspace member, builds separately so the
# product manifest never depends on verification tooling.
[workspace]


[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
orbis-core = { path = "/home/artt/Orbis-control-implementation/crates/orbis-core", version = "0.1.0" }
orbis-providers = { path = "/home/artt/Orbis-control-implementation/crates/orbis-providers", version = "0.1.0", default-features = false }
orbis-session-protocol = { path = "/home/artt/Orbis-control-implementation/crates/orbis-session-protocol", version = "0.1.0" }
orbis-sessiond = { path = "/home/artt/Orbis-control-implementation/crates/orbis-sessiond", version = "0.1.0", default-features = false }

[[bin]]
name = "orbis-fake-session-peer"
path = "src/main.rs"
