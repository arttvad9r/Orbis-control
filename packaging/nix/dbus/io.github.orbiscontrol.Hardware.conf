<?xml version="1.0" encoding="UTF-8"?>
<!-- D-Bus system policy для orbis-hardwared.
     Только: root может владеть именем; любой caller может отправлять
     method calls к этому сервису. Авторизация операции выполняется polkit
     внутри hardwared (io.github.orbiscontrol.hardware.set-performance-profile),
     поэтому здесь НЕ ограничиваем по method/interface. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.orbiscontrol.Hardware"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.orbiscontrol.Hardware"/>
  </policy>
</busconfig>
