name: Dashboard width once

on:
  push:
    branches:
      - agent/finish-v01
    paths:
      - .github/workflows/dashboard-width-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/finish-v01
          persist-credentials: true
      - name: Fix dashboard identity width
        shell: python
        run: |
          from pathlib import Path
          p = Path('ui/audited/sections/dashboard.slint')
          text = p.read_text()
          old1 = 'VerticalLayout {\n                        width: 300px;\n                        alignment: center;\n                        spacing: 4px;'
          new1 = 'VerticalLayout {\n                        width: 380px;\n                        alignment: center;\n                        spacing: 4px;'
          old2 = 'VerticalLayout {\n                        width: 144px;\n                        alignment: center;\n                        spacing: 3px;\n                        Text { text: "ЗДОРОВЬЕ";'
          new2 = 'VerticalLayout {\n                        width: 110px;\n                        alignment: center;\n                        spacing: 3px;\n                        Text { text: "ЗДОРОВЬЕ";'
          if old1 not in text or old2 not in text:
              raise SystemExit('Expected dashboard fragments not found')
          p.write_text(text.replace(old1, new1, 1).replace(old2, new2, 1))
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/audited/sections/dashboard.slint
          git commit -m 'Fix dashboard device identity layout'
          git push origin HEAD:agent/finish-v01
