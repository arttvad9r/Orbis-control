name: Start minimized persistence validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  targeted:
    if: github.head_ref == 'agent/start-minimized-persistence-validate-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact theme persistence base
        uses: actions/checkout@v5
        with:
          ref: agent/theme-persistence
          fetch-depth: 0

      - name: Verify exact base and clean target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3c1aba245c90f869024d7b8230c19cb33956ab9d"
          if git ls-remote --exit-code --heads origin refs/heads/agent/start-minimized-persistence >/dev/null 2>&1; then
            echo "agent/start-minimized-persistence already exists; refusing to overwrite"
            exit 1
          fi

      - name: Apply start minimized slice
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('crates/orbis-ui/src/main.rs')
          text = main.read_text()

          start = text.index('fn initial_theme_light_with(')
          end = text.index('\n#[derive(Debug)]\nenum ThemePersistenceFailure', start)
          block = r'''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          struct StartupPreferences {
              theme_light: bool,
              start_minimized: bool,
          }

          fn initial_startup_preferences_with(
              load: impl FnOnce() -> Result<PreferencesLoad, PreferencesError>,
          ) -> StartupPreferences {
              match load() {
                  Ok(load) => {
                      if let Some(warning) = &load.warning {
                          tracing::warn!(
                              path = ?warning.path,
                              kind = ?warning.kind,
                              "preferences load warning; using safe runtime preferences"
                          );
                      }
                      StartupPreferences {
                          theme_light: matches!(
                              load.preferences.appearance.theme,
                              ThemePreference::Light
                          ),
                          start_minimized: load.preferences.window.start_minimized,
                      }
                  }
                  Err(error) => {
                      tracing::warn!(
                          error = %error,
                          "preferences load failed; using safe runtime preferences"
                      );
                      StartupPreferences {
                          theme_light: false,
                          start_minimized: false,
                      }
                  }
              }
          }

          fn initialize_runtime_preferences_with(
              load: impl FnOnce() -> Result<PreferencesLoad, PreferencesError>,
          ) -> StartupPreferences {
              let preferences = initial_startup_preferences_with(load);
              set_current_theme_light(preferences.theme_light);
              preferences
          }

          fn initialize_runtime_preferences() -> StartupPreferences {
              initialize_runtime_preferences_with(load_preferences)
          }

          fn initialize_runtime_theme_with(
              load: impl FnOnce() -> Result<PreferencesLoad, PreferencesError>,
          ) -> bool {
              initialize_runtime_preferences_with(load).theme_light
          }

          fn apply_start_minimized(
              start_minimized: bool,
              mut set_minimized: impl FnMut(bool),
          ) {
              if start_minimized {
                  set_minimized(true);
              }
          }
          '''
          text = text[:start] + block + text[end:]

          old = '    initialize_runtime_theme();\n    let runtime = tokio::runtime::Runtime::new()?;'
          new = '    let startup_preferences = initialize_runtime_preferences();\n    let runtime = tokio::runtime::Runtime::new()?;'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    let app = build_app(&state, Some(worker_tx.clone()), Some(fan_defaults))?;
              app.window().set_size(LogicalSize::new(500.0, 680.0));
          '''
          new = '''    let app = build_app(&state, Some(worker_tx.clone()), Some(fan_defaults))?;
              app.window().set_size(LogicalSize::new(500.0, 680.0));
              apply_start_minimized(startup_preferences.start_minimized, |minimized| {
                  app.window().set_minimized(minimized);
              });
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          main.write_text(text)

          tests = Path('crates/orbis-ui/src/main_tests.rs')
          text = tests.read_text()
          anchor = '''#[test]
          fn theme_toggle_persists_only_theme_field()'''
          assert text.count(anchor) == 1
          addition = r'''#[test]
          fn persisted_start_minimized_is_loaded_before_first_render() {
              let td = tempfile::tempdir().expect("tempdir");
              let mut preferences = orbis_config::PreferencesConfig::default();
              preferences.appearance.theme = orbis_config::ThemePreference::Light;
              preferences.window.start_minimized = true;
              orbis_config::save_preferences_to_dir(&preferences, td.path())
                  .expect("save start minimized preferences");

              let startup = initialize_runtime_preferences_with(|| {
                  orbis_config::load_preferences_from_dir(td.path())
              });

              assert!(startup.theme_light);
              assert!(startup.start_minimized);
              assert!(matches!(current_theme_mode(), ThemeMode::Light));
          }

          #[test]
          fn missing_start_minimized_defaults_to_visible_startup() {
              let td = tempfile::tempdir().expect("tempdir");
              let startup = initialize_runtime_preferences_with(|| {
                  orbis_config::load_preferences_from_dir(td.path())
              });

              assert!(!startup.start_minimized);
              assert!(!startup.theme_light);
              assert!(matches!(current_theme_mode(), ThemeMode::Dark));
          }

          #[test]
          fn start_minimized_window_state_is_applied_only_when_enabled() {
              let calls = Cell::new(0usize);
              let requested = Cell::new(false);
              apply_start_minimized(false, |value| {
                  calls.set(calls.get() + 1);
                  requested.set(value);
              });
              assert_eq!(calls.get(), 0);

              apply_start_minimized(true, |value| {
                  calls.set(calls.get() + 1);
                  requested.set(value);
              });
              assert_eq!(calls.get(), 1);
              assert!(requested.get());
          }

          '''
          text = text.replace(anchor, addition + anchor, 1)
          tests.write_text(text)
          PY

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format and targeted validation
        run: |
          set -euo pipefail
          nix develop --command bash -lc '
            set -euo pipefail
            cargo fmt --all
            cargo fmt --all -- --check
            cargo check -p orbis-ui --all-targets
            cargo test -p orbis-ui start_minimized
            cargo test -p orbis-ui persisted_start_minimized
            cargo clippy -p orbis-ui --all-targets -- -D warnings
          '

      - name: Verify exact scope
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/changed.txt
          cat >/tmp/allowed.txt <<'EOF'
          crates/orbis-ui/src/main.rs
          crates/orbis-ui/src/main_tests.rs
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - name: Publish one implementation commit
        run: |
          set -euo pipefail
          git config user.name "arttvad9r"
          git config user.email "arttvad9r@gmail.com"
          git add crates/orbis-ui/src/main.rs crates/orbis-ui/src/main_tests.rs
          git commit -m "ui: apply persisted start minimized preference [skip ci]"
          test "$(git rev-list --count 3c1aba245c90f869024d7b8230c19cb33956ab9d..HEAD)" = "1"
          git push origin HEAD:refs/heads/agent/start-minimized-persistence
