name: Diagnostics capability adapter validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  targeted:
    if: github.head_ref == 'agent/diagnostics-capability-adapter-validate-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v5
        with:
          ref: agent/diagnostics-capability-adapter
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Targeted orbis-capabilities checks
        run: |
          set -euo pipefail
          nix develop --command bash -lc '
            set -euo pipefail
            cargo fmt --all -- --check
            cargo check -p orbis-capabilities --all-targets
            cargo test -p orbis-capabilities diagnostics
            cargo clippy -p orbis-capabilities --all-targets -- -D warnings
          '

      - name: Check narrow diff
        run: |
          set -euo pipefail
          git diff --check 59722740ba44b366d99715f1572ba99462a38d2b..HEAD
          git diff --name-only 59722740ba44b366d99715f1572ba99462a38d2b..HEAD | sort > /tmp/changed.txt
          cat >/tmp/allowed.txt <<'EOF'
          crates/orbis-capabilities/src/diagnostics.rs
          crates/orbis-capabilities/src/lib.rs
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
