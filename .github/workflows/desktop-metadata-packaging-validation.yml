name: Desktop metadata packaging validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/desktop-metadata-packaging-validate-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact implementation
        uses: actions/checkout@v5
        with:
          ref: agent/desktop-metadata-packaging
          fetch-depth: 0

      - name: Normalize known UI manifest syntax in checkout only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/orbis-ui/Cargo.toml')
          s = p.read_text()
          old = '\n'.join([
              'orbis-providers = {',
              '    path = "../orbis-providers",',
              '    version = "0.1.0",',
              '    default-features = false,',
              '    features = ["mock"],',
              '}',
          ])
          new = 'orbis-providers = { path = "../orbis-providers", version = "0.1.0", default-features = false, features = ["mock"] }'
          if s.count(old) != 1:
              raise SystemExit('known manifest block did not match exactly once')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate source metadata
        run: |
          set -euo pipefail
          rev="$(python3 -c 'import json; print(json.load(open("flake.lock"))["nodes"]["nixpkgs"]["locked"]["rev"])')"
          nix shell "github:NixOS/nixpkgs/${rev}#desktop-file-utils" -c desktop-file-validate data/applications/io.github.orbiscontrol.Orbis.desktop
          nix shell "github:NixOS/nixpkgs/${rev}#appstream" -c appstreamcli validate --no-net data/metainfo/io.github.orbiscontrol.Orbis.metainfo.xml

      - name: Build package and inspect installed metadata
        run: |
          set -euo pipefail
          nix build .#orbis-control --print-build-logs
          test -f result/share/applications/io.github.orbiscontrol.Orbis.desktop
          test -f result/share/metainfo/io.github.orbiscontrol.Orbis.metainfo.xml
          grep -Fx 'Exec=orbis-control' result/share/applications/io.github.orbiscontrol.Orbis.desktop
          ! grep -q '^Icon=' result/share/applications/io.github.orbiscontrol.Orbis.desktop

      - name: Verify implementation scope
        run: |
          set -euo pipefail
          git checkout -- crates/orbis-ui/Cargo.toml
          git diff --check agent/desktop-integration-metadata..HEAD
          git diff --name-only agent/desktop-integration-metadata..HEAD | sort > /tmp/changed.txt
          printf '%s\n' data/applications/io.github.orbiscontrol.Orbis.desktop packaging/nix/package.nix | sort > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
