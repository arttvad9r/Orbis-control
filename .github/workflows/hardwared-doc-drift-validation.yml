name: Hardwared doc drift validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/hardwared-doc-drift-cleanup-validate-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v5
        with:
          ref: agent/hardwared-doc-drift-cleanup
          fetch-depth: 0

      - name: Refresh hardwared crate rustdoc
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/orbis-hardwared/src/lib.rs')
          s = p.read_text()
          old = '\n'.join([
              '//! # orbis-hardwared — foundation привилегированного hardware helper.',
              '//!',
              '//! Единственная capability на этом этапе (ADR 0006):',
              '//! `SetPerformanceProfile` через kernel `/sys/firmware/acpi/platform_profile`.',
              '//!',
              '//! - closed API: принимает только semantic [`PerformanceProfile`]; клиент не',
              '//!   передаёт пути, строки или sysfs-символы;',
              '//! - mapping внутри hardwared: `Silent → quiet`, `Balanced → balanced`,',
              '//!   `Turbo → performance`;',
              '//! - никакого generic filesystem writer API;',
              '//! - никакого кэша/optimistic success: каждый вызов читает choices и делает',
              '//!   fresh read-back;',
              '//! - D-Bus/polkit/activation/identity contract — следующий шаг (ADR 0006);',
              '//!   этот crate не выполняет I/O к реальному sysfs в тестах (fake backend).',
          ]) + '\n'
          new = '\n'.join([
              '//! # orbis-hardwared — privileged typed Hardware1 helper.',
              '//!',
              '//! The system service exposes only closed capability-specific operations. It',
              '//! never accepts arbitrary filesystem paths, sysfs symbols, D-Bus destinations,',
              '//! or generic mutation payloads from clients.',
              '//!',
              '//! - each production mutation owns its typed validation/read-back contract;',
              '//! - each privileged method authorizes the original system-bus sender through',
              '//!   its dedicated polkit action before mutation;',
              '//! - writable kernel ABI is constrained independently by the NixOS service',
              '//!   sandbox; service presence alone never proves a capability is supported;',
              '//! - no optimistic success: mutation paths use authoritative read-back where',
              '//!   their backend contract provides it;',
              '//! - tests use injected/fake backends and perform no live hardware writes.',
          ]) + '\n'
          if s.count(old) != 1:
              raise SystemExit('stale hardwared rustdoc block did not match exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
          rustfmt --check crates/orbis-hardwared/src/lib.rs

      - name: Validate documentation-only scope
        run: |
          set -euo pipefail
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('packaging/nix/dbus/io.github.orbiscontrol.Hardware.conf')"
          git diff --check
          git diff --name-only chatgpt/production-hardening-20260818..HEAD | sort > /tmp/changed.txt
          printf '%s\n' crates/orbis-hardwared/src/lib.rs packaging/nix/dbus/io.github.orbiscontrol.Hardware.conf packaging/nix/module.nix | sort > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - name: Publish rustdoc update
        run: |
          set -euo pipefail
          git config user.name "arttvad9r"
          git config user.email "arttvad9r@gmail.com"
          git add crates/orbis-hardwared/src/lib.rs
          git diff --cached --check
          git commit -m "docs(hardwared): refresh privileged boundary rustdoc [skip ci]"
          git push origin HEAD:agent/hardwared-doc-drift-cleanup
