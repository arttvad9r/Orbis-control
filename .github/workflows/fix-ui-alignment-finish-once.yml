name: Finish UI alignment once

on:
  push:
    branches: [agent/finish-v01]
    paths:
      - '.github/workflows/fix-ui-alignment-finish-once.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/finish-v01
          persist-credentials: true

      - name: Fix remaining cross-axis drift
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {text.count(old)}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def regex_replace(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              text, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {n}: {pattern}")
              p.write_text(text)

          # Dashboard fan rows: icon and both labels share the same vertical center.
          replace("ui/audited/sections/dashboard.slint",
              'Text { text: "CPU"; font-size: 12.5px; color: Palette.text-secondary; }',
              'Text { vertical-stretch: 1; text: "CPU"; font-size: 12.5px; color: Palette.text-secondary; vertical-alignment: center; }')
          replace("ui/audited/sections/dashboard.slint",
              'Text { text: root.ui-state.cpu-fan-rpm; font-size: 14px; font-weight: 650; color: Palette.text-primary; }',
              'Text { vertical-stretch: 1; text: root.ui-state.cpu-fan-rpm; font-size: 14px; font-weight: 650; color: Palette.text-primary; vertical-alignment: center; }')
          replace("ui/audited/sections/dashboard.slint",
              'Text { text: "GPU"; font-size: 12.5px; color: Palette.text-secondary; }',
              'Text { vertical-stretch: 1; text: "GPU"; font-size: 12.5px; color: Palette.text-secondary; vertical-alignment: center; }')
          replace("ui/audited/sections/dashboard.slint",
              'Text { text: root.ui-state.gpu-fan-rpm; font-size: 14px; font-weight: 650; color: Palette.text-primary; }',
              'Text { vertical-stretch: 1; text: root.ui-state.gpu-fan-rpm; font-size: 14px; font-weight: 650; color: Palette.text-primary; vertical-alignment: center; }')

          # Performance footer action: center the 36px visual control in the tall card.
          replace("ui/audited/sections/performance.slint",
              '                    ActionButton { label: "Открыть графику"; clicked => { root.graphics-open-requested(); } }',
              '''                    Rectangle {
                        width: 126px;
                        vertical-stretch: 1;
                        background: transparent;
                        ActionButton {
                            width: parent.width;
                            y: (parent.height - self.height) / 2;
                            label: "Открыть графику";
                            clicked => { root.graphics-open-requested(); }
                        }
                    }''')

          # GPU overview pills: format-tolerant matching because Slint formatting may vary.
          regex_replace("ui/audited/sections/graphics.slint",
              r'StatusPill\s*\{\s*text:\s*root\.ui-state\.gpu-mode-writable\s*\?\s*"Доступно"\s*:\s*"Наблюдение";\s*accent:\s*root\.ui-state\.gpu-mode-writable\s*\?\s*Palette\.success\s*:\s*Palette\.text-secondary;\s*\}',
              '''Rectangle {
                            width: root.ui-state.gpu-mode-writable ? 88px : 112px;
                            vertical-stretch: 1;
                            background: transparent;
                            StatusPill {
                                width: parent.width;
                                y: (parent.height - self.height) / 2;
                                text: root.ui-state.gpu-mode-writable ? "Доступно" : "Наблюдение";
                                accent: root.ui-state.gpu-mode-writable ? Palette.success : Palette.text-secondary;
                            }
                        }''')
          regex_replace("ui/audited/sections/graphics.slint",
              r'if\s*\(root\.ui-state\.gpu-reboot-required\)\s*:\s*StatusPill\s*\{\s*text:\s*"Нужен перезапуск";\s*accent:\s*Palette\.warning;\s*\}',
              '''if (root.ui-state.gpu-reboot-required) : Rectangle {
                            width: 150px;
                            vertical-stretch: 1;
                            background: transparent;
                            StatusPill {
                                width: parent.width;
                                y: (parent.height - self.height) / 2;
                                text: "Нужен перезапуск";
                                accent: Palette.warning;
                            }
                        }''')

          # Display overview pill: center against the two-line mode block.
          regex_replace("ui/audited/sections/display.slint",
              r'StatusPill\s*\{\s*text:\s*root\.display-state-ready\s*\?\s*"Наблюдается"\s*:\s*"Получение данных";\s*accent:\s*root\.display-state-ready\s*\?\s*Palette\.success\s*:\s*Palette\.warning;\s*\}',
              '''Rectangle {
                        width: root.display-state-ready ? 114px : 146px;
                        vertical-stretch: 1;
                        background: transparent;
                        StatusPill {
                            width: parent.width;
                            y: (parent.height - self.height) / 2;
                            text: root.display-state-ready ? "Наблюдается" : "Получение данных";
                            accent: root.display-state-ready ? Palette.success : Palette.warning;
                        }
                    }''')

          # Cooling status and action rows: center smaller controls in 36/40px rows.
          regex_replace("ui/audited/sections/cooling.slint",
              r'StatusPill\s*\{\s*text:\s*root\.ui-state\.fan-curve-writable\s*\?\s*"Редактирование"\s*:\s*"Наблюдение";\s*accent:\s*root\.ui-state\.fan-curve-writable\s*\?\s*Palette\.success\s*:\s*Palette\.text-secondary;\s*\}',
              '''Rectangle {
                    width: root.ui-state.fan-curve-writable ? 130px : 112px;
                    vertical-stretch: 1;
                    background: transparent;
                    StatusPill {
                        width: parent.width;
                        y: (parent.height - self.height) / 2;
                        text: root.ui-state.fan-curve-writable ? "Редактирование" : "Наблюдение";
                        accent: root.ui-state.fan-curve-writable ? Palette.success : Palette.text-secondary;
                    }
                }''')
          regex_replace("ui/audited/sections/cooling.slint",
              r'ActionButton\s*\{\s*label:\s*"Заводские значения";\s*disabled:\s*root\.mutation-safety-blocked\s*\|\|\s*!root\.factory-reset-available\s*\|\|\s*!root\.ui-state\.fan-curve-writable\s*\|\|\s*root\.ui-state\.fan-curve-error;\s*clicked\s*=>\s*\{\s*root\.factory-reset-pending\s*=\s*true;\s*\}\s*\}\s*ActionButton\s*\{\s*label:\s*root\.factory-reset-pending\s*\?\s*"Применить заводские"\s*:\s*"Применить изменения";\s*accent:\s*root\.factory-reset-pending\s*\|\|\s*root\.ui-state\.fan-curve-dirty;\s*disabled:\s*root\.mutation-safety-blocked\s*\|\|\s*!root\.ui-state\.fan-curve-writable\s*\|\|\s*root\.ui-state\.fan-curve-error\s*\|\|\s*\(!root\.factory-reset-pending\s*&&\s*!root\.ui-state\.fan-curve-dirty\);\s*clicked\s*=>\s*\{\s*let reset\s*=\s*root\.factory-reset-pending;\s*root\.fan-apply-clicked\(reset\);\s*if\s*\(reset\)\s*\{\s*root\.factory-reset-pending\s*=\s*false;\s*\}\s*\}\s*\}',
              '''Rectangle {
                            width: 146px;
                            vertical-stretch: 1;
                            background: transparent;
                            ActionButton {
                                width: parent.width;
                                y: (parent.height - self.height) / 2;
                                label: "Заводские значения";
                                disabled: root.mutation-safety-blocked || !root.factory-reset-available || !root.ui-state.fan-curve-writable || root.ui-state.fan-curve-error;
                                clicked => { root.factory-reset-pending = true; }
                            }
                        }
                        Rectangle {
                            width: 168px;
                            vertical-stretch: 1;
                            background: transparent;
                            ActionButton {
                                width: parent.width;
                                y: (parent.height - self.height) / 2;
                                label: root.factory-reset-pending ? "Применить заводские" : "Применить изменения";
                                accent: root.factory-reset-pending || root.ui-state.fan-curve-dirty;
                                disabled: root.mutation-safety-blocked || !root.ui-state.fan-curve-writable || root.ui-state.fan-curve-error || (!root.factory-reset-pending && !root.ui-state.fan-curve-dirty);
                                clicked => {
                                    let reset = root.factory-reset-pending;
                                    root.fan-apply-clicked(reset);
                                    if (reset) { root.factory-reset-pending = false; }
                                }
                            }
                        }''')

          print("Final alignment fixes applied")
          PY
          git diff --check
          git diff --stat

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            wayland-protocols libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libdbus-1-dev libssl-dev libsystemd-dev libglib2.0-dev libcairo2-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.87'

      - name: Compile UI
        run: cargo check -p orbis-ui --locked

      - name: Render all canonical screenshots
        run: bash scripts/update-ui-screenshots.sh

      - name: Upload final visual review
        uses: actions/upload-artifact@v4
        with:
          name: orbis-ui-aligned-final
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit final alignment pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ui screenshots
          git diff --cached --check
          git commit -m "Finish UI alignment polish"
          git push origin HEAD:agent/finish-v01
