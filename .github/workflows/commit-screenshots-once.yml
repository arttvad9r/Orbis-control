name: Commit screenshots once

on:
  push:
    branches:
      - agent/finish-v01
    paths:
      - .github/workflows/commit-screenshots-once.yml

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/finish-v01
          persist-credentials: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libdbus-1-dev \
            libssl-dev \
            libsystemd-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.87'

      - name: Refresh canonical screenshots
        run: bash scripts/update-ui-screenshots.sh

      - name: Commit screenshots
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/*.png
          if git diff --cached --quiet; then
            echo "Canonical screenshots already match the renderer."
            exit 0
          fi
          git commit -m "Refresh canonical UI screenshots"
          git push origin HEAD:agent/finish-v01
