name: Diagnostics ASUS capabilities validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  targeted:
    if: github.head_ref == 'agent/diagnostics-asus-capabilities-validate-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v5
        with:
          ref: agent/diagnostics-asus-capabilities
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Targeted orbis-providers checks
        run: |
          set -euo pipefail
          nix develop --command bash -lc '
            set -euo pipefail
            cargo fmt --all -- --check
            cargo check -p orbis-providers --all-targets
            cargo test -p orbis-providers asus_diagnostics
            cargo clippy -p orbis-providers --all-targets -- -D warnings
          '

      - name: Check narrow diff
        run: |
          set -euo pipefail
          git diff --check b929769613d08c41ffc47f2b4619c3da872e1609..HEAD
          git diff --name-only b929769613d08c41ffc47f2b4619c3da872e1609..HEAD | sort > /tmp/changed.txt
          cat >/tmp/allowed.txt <<'EOF'
          crates/orbis-providers/src/asus_diagnostics.rs
          crates/orbis-providers/src/lib.rs
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
