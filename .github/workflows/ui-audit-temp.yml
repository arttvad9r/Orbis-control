name: UI audit temporary

on:
  push:
    branches:
      - agent/full-visual-ui

permissions:
  contents: write

jobs:
  finish-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Final visual label cleanup
        shell: python
        run: |
          from pathlib import Path
          path = Path("ui/audited/fan-curve-editor-v3.slint")
          text = path.read_text()
          up = text.replace('"Hysteresis up"', '"Hyst up: "')
          down = up.replace('"Hysteresis down"', '"Hyst down: "')
          if down == text:
              raise SystemExit("expected hysteresis labels not found")
          path.write_text(down)
      - name: Remove temporary audit workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-audit-temp.yml
          git add ui/audited/fan-curve-editor-v3.slint
          git commit -m "ui: finish visual audit cleanup"
          git push origin HEAD:agent/full-visual-ui
