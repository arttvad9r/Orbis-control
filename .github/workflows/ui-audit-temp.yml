name: UI audit temporary

on:
  push:
    branches:
      - agent/full-visual-ui

concurrency:
  group: ui-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Align audit snapshot sizes with native windows
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/orbis-ui/examples/ui_snapshot.rs")
          text = path.read_text()
          replacements = {
              '"automation" => (700, 540),': '"automation" => (700, 600),',
              '"preferences" => (580, 530),': '"preferences" => (580, 550),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected snapshot size not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/orbis-ui/examples/ui_snapshot.rs
          git commit -m "test: render secondary windows at native sizes"
          git push origin HEAD:agent/full-visual-ui
