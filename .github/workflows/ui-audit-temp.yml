name: UI audit temporary

on:
  push:
    branches:
      - agent/full-visual-ui

concurrency:
  group: ui-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Persist Slint graph grid corrections
        shell: python
        run: |
          from pathlib import Path
          path = Path("ui/audited/fan-curve-editor-v3.slint")
          text = path.read_text()
          replacements = {
              "y: 25%;": "y: parent.height * 0.25;",
              "y: 50%;": "y: parent.height * 0.50;",
              "y: 75%;": "y: parent.height * 0.75;",
              "x: 25%;": "x: parent.width * 0.25;",
              "x: 50%;": "x: parent.width * 0.50;",
              "x: 75%;": "x: parent.width * 0.75;",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected graph coordinate not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/audited/fan-curve-editor-v3.slint
          git commit -m "ui: use explicit fan graph grid coordinates"
          git push origin HEAD:agent/full-visual-ui
