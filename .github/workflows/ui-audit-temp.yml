name: UI audit temporary

on:
  push:
    branches:
      - agent/full-visual-ui

concurrency:
  group: ui-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Remove conflicting fixed-size constraints
        shell: python
        run: |
          from pathlib import Path
          import re

          windows = [
              "ui/audited/main-window.slint",
              "ui/audited/automation-window.slint",
              "ui/audited/diagnostics-window.slint",
              "ui/audited/extra-window.slint",
              "ui/audited/fans-window.slint",
              "ui/audited/preferences-window.slint",
              "ui/audited/updates-window.slint",
          ]
          changed = []
          for name in windows:
              path = Path(name)
              text = path.read_text()
              fixed = re.sub(r"^\s*(?:min-width|min-height|max-width|max-height):[^\n]*\n", "", text, flags=re.MULTILINE)
              if fixed != text:
                  path.write_text(fixed)
                  changed.append(name)
          fan = Path("ui/audited/fan-curve-editor-v3.slint")
          text = fan.read_text()
          fixed = re.sub(r"^\s*min-height:\s*460px;\s*\n", "", text, count=1, flags=re.MULTILINE)
          if fixed != text:
              fan.write_text(fixed)
              changed.append(str(fan))
          if len(changed) != 8:
              raise SystemExit(f"expected 8 files changed, got {changed}")
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/audited
          git commit -m "ui: use Slint-compatible fixed window sizes"
          git push origin HEAD:agent/full-visual-ui
