name: UI audit temporary

on:
  push:
    branches:
      - agent/full-visual-ui

concurrency:
  group: ui-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Persist Slint Path compatibility corrections
        shell: python
        run: |
          from pathlib import Path
          path = Path("ui/audited/fan-curve-editor-v3.slint")
          text = path.read_text()
          corrected = text.replace("; fit: fill;", ";").replace("; stroke-line-join: round;", ";")
          if corrected == text:
              raise SystemExit("expected Path compatibility properties not found")
          path.write_text(corrected)
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/audited/fan-curve-editor-v3.slint
          git commit -m "ui: use Slint 1.13-compatible fan curve Path"
          git push origin HEAD:agent/full-visual-ui
      - name: Use current stable Rust for UI audit
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - name: Work around inherited manifest syntax
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/orbis-ui/Cargo.toml")
          text = path.read_text()
          old = "orbis-providers = {\n    path = \"../orbis-providers\",\n    version = \"0.1.0\",\n    default-features = false,\n    features = [\"mock\"],\n}"
          new = 'orbis-providers = { path = "../orbis-providers", version = "0.1.0", default-features = false, features = ["mock"] }'
          if old not in text: raise SystemExit("expected inherited manifest block not found")
          path.write_text(text.replace(old, new))
      - name: Check UI crate
        run: cargo check -p orbis-ui --all-targets
