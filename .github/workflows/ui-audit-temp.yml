name: UI audit temporary

on:
  push:
    branches:
      - agent/full-visual-ui

concurrency:
  group: ui-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Persist screenshot-driven visual corrections
        shell: python
        run: |
          from pathlib import Path

          common = Path("ui/audited/common.slint")
          text = common.read_text()
          old = '''    HorizontalLayout {\n        alignment: center;\n        Text { text: root.title; font-size: 10px;'''
          new = '''    HorizontalLayout {\n        alignment: center;\n        spacing: 8px;\n        Text { text: root.title; font-size: 10px;'''
          if old not in text:
              raise SystemExit("SectionTitle layout pattern not found")
          common.write_text(text.replace(old, new, 1))

          mode = Path("ui/components/mode-card.slint")
          text = mode.read_text()
          old = 'property <length> title-size: root.compact ? 12px : 13px;'
          new = 'property <length> title-size: root.compact ? 11px : 13px;'
          if old not in text:
              raise SystemExit("ModeCard compact title size not found")
          mode.write_text(text.replace(old, new, 1))

          main = Path("ui/audited/main-window.slint")
          text = main.read_text()
          old_import = 'import { ComboBox, Slider, CheckBox } from "std-widgets.slint";'
          new_import = 'import { ComboBox, Slider } from "std-widgets.slint";'
          if old_import not in text:
              raise SystemExit("main std widgets import not found")
          text = text.replace(old_import, new_import, 1)
          marker = 'export component AppWindow inherits Window {'
          component = '''component DarkCheckBox inherits Rectangle {\n    in property <string> text;\n    in-out property <bool> checked: false;\n    in property <bool> disabled: false;\n    height: 20px;\n    min-width: 112px;\n    background: transparent;\n    HorizontalLayout {\n        spacing: 6px;\n        alignment: center;\n        Rectangle {\n            width: 14px; height: 14px; border-radius: 2px; border-width: 1px;\n            border-color: root.checked && !root.disabled ? Palette.accent-default : Palette.border-default;\n            background: root.checked && !root.disabled ? Palette.accent-default : Palette.surface-default;\n            if (root.checked) : Text { text: "✓"; font-size: 10px; font-weight: 700; color: Palette.text-primary; horizontal-alignment: center; vertical-alignment: center; }\n        }\n        Text { text: root.text; font-size: 9px; color: root.disabled ? Palette.text-disabled : Palette.text-secondary; vertical-alignment: center; overflow: elide; }\n        Rectangle { horizontal-stretch: 1; background: transparent; }\n    }\n    TouchArea { enabled: !root.disabled; clicked => { root.checked = !root.checked; } }\n}\n\n'''
          if marker not in text:
              raise SystemExit("AppWindow marker not found")
          text = text.replace(marker, component + marker, 1)
          replacements = {
              'CheckBox { text: "Disable on battery"; checked <=> root.slash-battery-preview; }': 'DarkCheckBox { text: "Disable on battery"; checked <=> root.slash-battery-preview; }',
              'CheckBox { text: "Disable on lid close"; checked <=> root.slash-lid-preview; }': 'DarkCheckBox { text: "Disable on lid close"; checked <=> root.slash-lid-preview; }',
              'CheckBox { text: "Run on Startup"; checked <=> root.startup-preview; }': 'DarkCheckBox { text: "Run on Startup"; checked <=> root.startup-preview; }',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"main checkbox not found: {old}")
              text = text.replace(old, new, 1)
          main.write_text(text)

          snap = Path("crates/orbis-ui/examples/ui_snapshot.rs")
          text = snap.read_text()
          if '"dialog" => (430, 230),' in text:
              text = text.replace('"dialog" => (430, 230),', '"dialog" => (430, 220),', 1)
              snap.write_text(text)
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/audited/common.slint ui/audited/main-window.slint ui/components/mode-card.slint crates/orbis-ui/examples/ui_snapshot.rs
          git commit -m "ui: polish dark controls and section spacing"
          git push origin HEAD:agent/full-visual-ui
