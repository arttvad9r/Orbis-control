name: UI audit temporary

on:
  push:
    branches:
      - agent/full-visual-ui

concurrency:
  group: ui-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Persist preview dialog lifecycle wiring
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/orbis-ui/src/main.rs")
          text = path.read_text()
          old = '''        if slot.is_none() {\n            *slot = Some(PreviewDialogWindow::new()?);\n        }\n        let window = slot.as_ref().expect("PreviewDialogWindow initialized");\n'''
          new = '''        if slot.is_none() {\n            let window = PreviewDialogWindow::new()?;\n            let weak = window.as_weak();\n            window.on_dismiss_clicked(move || {\n                if let Some(window) = weak.upgrade() {\n                    let _ = window.hide();\n                }\n            });\n            *slot = Some(window);\n        }\n        let window = slot.as_ref().expect("PreviewDialogWindow initialized");\n'''
          if old not in text:
              raise SystemExit("expected PreviewDialogWindow initialization not found")
          path.write_text(text.replace(old, new, 1))
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/orbis-ui/src/main.rs
          git commit -m "ui: wire preview dialog dismiss callback"
          git push origin HEAD:agent/full-visual-ui
