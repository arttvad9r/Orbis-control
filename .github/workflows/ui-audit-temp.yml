name: UI audit temporary

on:
  push:
    branches:
      - agent/full-visual-ui

concurrency:
  group: ui-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Use current stable Rust for UI audit
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - name: Persist quit lifecycle correction
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return False
                  raise SystemExit(f"expected text not found in {path}")
              p.write_text(text.replace(old, new))
              return True

          changed = False
          changed |= replace(
              "ui/audited/main-window.slint",
              "    callback preview-dialog-clicked(int);\n",
              "    callback preview-dialog-clicked(int);\n    callback quit-clicked;\n",
          )
          changed |= replace(
              "ui/audited/main-window.slint",
              '            ActionButton { width: 62px; label: "Quit"; clicked => { root.close(); } }',
              '            ActionButton { width: 62px; label: "Quit"; clicked => { root.quit-clicked(); } }',
          )

          marker = '''    app.on_preview_dialog_clicked(move |kind| {\n        if let Err(e) = show_preview_dialog(kind) {\n            tracing::warn!("не удалось открыть PreviewDialogWindow: {e:?}");\n        }\n    });\n'''
          replacement = marker + '''    {\n        let app_weak = app.as_weak();\n        app.on_quit_clicked(move || {\n            FANS_WINDOW.with(|slot| {\n                if let Some(window) = slot.borrow().as_ref() { let _ = window.hide(); }\n            });\n            EXTRA_WINDOW.with(|slot| {\n                if let Some(window) = slot.borrow().as_ref() { let _ = window.hide(); }\n            });\n            AUTOMATION_WINDOW.with(|slot| {\n                if let Some(window) = slot.borrow().as_ref() { let _ = window.hide(); }\n            });\n            PREFERENCES_WINDOW.with(|slot| {\n                if let Some(window) = slot.borrow().as_ref() { let _ = window.hide(); }\n            });\n            DIAGNOSTICS_WINDOW.with(|slot| {\n                if let Some(window) = slot.borrow().as_ref() { let _ = window.hide(); }\n            });\n            UPDATES_WINDOW.with(|slot| {\n                if let Some(window) = slot.borrow().as_ref() { let _ = window.hide(); }\n            });\n            PREVIEW_DIALOG_WINDOW.with(|slot| {\n                if let Some(window) = slot.borrow().as_ref() { let _ = window.hide(); }\n            });\n            if let Some(app) = app_weak.upgrade() { let _ = app.hide(); }\n        });\n    }\n'''
          changed |= replace("crates/orbis-ui/src/main.rs", marker, replacement)
          Path("/tmp/ui_changed").write_text("1" if changed else "0")
      - name: Commit correction
        run: |
          if [ "$(cat /tmp/ui_changed)" = "0" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/audited/main-window.slint crates/orbis-ui/src/main.rs
          git commit -m "ui: make Quit close all application windows"
          git push origin HEAD:agent/full-visual-ui
      - name: Work around inherited manifest syntax
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/orbis-ui/Cargo.toml")
          text = path.read_text()
          old = "orbis-providers = {\n    path = \"../orbis-providers\",\n    version = \"0.1.0\",\n    default-features = false,\n    features = [\"mock\"],\n}"
          new = 'orbis-providers = { path = "../orbis-providers", version = "0.1.0", default-features = false, features = ["mock"] }'
          if old not in text: raise SystemExit("expected inherited manifest block not found")
          path.write_text(text.replace(old, new))
      - name: Check UI crate
        run: cargo check -p orbis-ui --all-targets
