<?xml version="1.0" encoding="UTF-8"?>
<!-- D-Bus system policy for orbis-hardwared.
     Only root may own the destination; callers may send method calls to the
     closed Hardware1 API. This bus policy is not mutation authorization:
     every typed mutation is checked inside hardwared against its dedicated
     polkit action using the original system-bus sender. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.orbiscontrol.Hardware"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.orbiscontrol.Hardware"/>
  </policy>
</busconfig>
